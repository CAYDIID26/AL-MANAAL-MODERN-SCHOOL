<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Al Manaal Modern School</title></head><body><title>SchoolHub Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy crest rail (logo + collapsible modules, gold trim) + light working sheet; rail is a drawer on phones. Palette taken from the school crest: navy + gold */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#eaeef6; --line:#d9dfeb;
  --fg:#14213d; --muted:#5a6680; --rail:#0e2c6b; --rail-2:#081a45; --rail-fg:#e8edf8; --rail-muted:#9fb1d6;
  --gold:#c9921f; --gold-2:#e7b94d; --primary:#14398a; --primary-ink:#ffffff;
  --accent:#c9921f; --accent-ink:#ffffff; --accent-soft:#f8eed6;
  --c2:#1f68c9; --c2-soft:#dfe9f8; --c3:#0f8a83; --c3-soft:#d8efed; --c4:#c2557a; --c4-soft:#f6dfe7;
  --ok:#22804f; --ok-soft:#dcf0e4; --warn:#a96a00; --warn-soft:#f8ebd1; --bad:#b8342d; --bad-soft:#f7dcda;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(14,44,107,.06),0 4px 14px rgba(14,44,107,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1222; --surface:#121b30; --sunk:#18233c; --line:#26344f;
  --fg:#e6ebf5; --muted:#94a2bf; --rail:#0a1d47; --rail-2:#060f2a; --rail-fg:#e6ecf8; --rail-muted:#8ea0c8;
  --gold:#e2ac45; --gold-2:#f0c868; --primary:#e2ac45; --primary-ink:#1a1205;
  --accent:#e2ac45; --accent-ink:#1a1205; --accent-soft:#3a2e15;
  --c2:#5c9cf0; --c2-soft:#172a4b; --c3:#3fc1b6; --c3-soft:#12322f; --c4:#ea8bab; --c4-soft:#3b1f2c;
  --ok:#5fc48c; --ok-soft:#173226; --warn:#e6aa4f; --warn-soft:#3a2d16; --bad:#ef7b72; --bad-soft:#3e2120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1222; --surface:#121b30; --sunk:#18233c; --line:#26344f;
  --fg:#e6ebf5; --muted:#94a2bf; --rail:#0a1d47; --rail-2:#060f2a; --rail-fg:#e6ecf8; --rail-muted:#8ea0c8;
  --gold:#e2ac45; --gold-2:#f0c868; --primary:#e2ac45; --primary-ink:#1a1205;
  --accent:#e2ac45; --accent-ink:#1a1205; --accent-soft:#3a2e15;
  --c2:#5c9cf0; --c2-soft:#172a4b; --c3:#3fc1b6; --c3-soft:#12322f; --c4:#ea8bab; --c4-soft:#3b1f2c;
  --ok:#5fc48c; --ok-soft:#173226; --warn:#e6aa4f; --warn-soft:#3a2d16; --bad:#ef7b72; --bad-soft:#3e2120;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100%}
/* rail */
.rail{background:linear-gradient(180deg,var(--rail) 0%,var(--rail-2) 100%);box-shadow:inset -3px 0 0 var(--gold);color:var(--rail-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.rail-top{padding:18px 16px 14px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid rgba(231,185,77,.25)}
.brand{display:flex;gap:11px;align-items:center}
.brand-logo{width:54px;height:54px;flex:none;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 2px var(--gold),0 4px 12px rgba(0,0,0,.25);object-fit:contain}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.brand-name{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.15;color:#fff;text-wrap:balance}
.brand-sub{font-size:11px;color:var(--gold-2);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.rail-search{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border-radius:7px;padding:6px 10px}
.rail-search input{background:none;border:0;outline:0;color:var(--rail-fg);width:100%;font-size:13px}
.rail-search input::placeholder{color:var(--rail-muted)}
.rail-scroll{overflow-y:auto;flex:1;padding:10px 10px 16px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav a,.nav button.grp{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--rail-fg);text-decoration:none;font-size:13.5px;width:100%;background:none;border:0;cursor:pointer;text-align:left}
.nav a:hover,.nav button.grp:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:linear-gradient(90deg,rgba(231,185,77,.22),rgba(231,185,77,.04));box-shadow:inset 3px 0 0 var(--gold-2);color:#fff}
.nav button.grp.has-on{color:#fff;font-weight:600}
.nav button.grp.has-on svg:first-child{color:var(--gold-2);opacity:1}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .chev{margin-left:auto;width:14px;height:14px;transition:transform .15s;opacity:.6}
.nav .grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub{display:flex;flex-direction:column;padding:2px 0 6px;gap:1px}
.sub a{font-size:13px;padding:6px 10px;color:var(--rail-muted)}
.sub{border-left:1px solid rgba(231,185,77,.25);margin-left:18px;padding-left:9px}
.sub a.on{color:#fff;background:rgba(231,185,77,.16);box-shadow:inset 2px 0 0 var(--gold-2)}
.rail-foot{padding:12px 16px;font-size:11.5px;color:var(--rail-muted);border-top:1px solid rgba(231,185,77,.25);background:rgba(0,0,0,.18)}
.mode-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;background:rgba(255,255,255,.08);color:var(--rail-fg)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap;box-shadow:0 2px 0 -1px var(--accent-soft)}
.top-logo{display:none;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px var(--gold)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:36px;height:36px;cursor:pointer}
.topbar h1{font-family:var(--display);font-size:20px;font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
.crumb{font-size:12px;color:var(--muted)}
.topbar .grow{flex:1;min-width:140px}
.top-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.branch-sel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:2px 4px 2px 10px;background:var(--sunk)}
.branch-sel svg{width:15px;height:15px;color:var(--muted)}
.branch-sel select{border:0;background:transparent;padding:5px 4px;font-weight:500;max-width:190px}
.content{padding-block:22px 56px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1280px;width:100%}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row .grow{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--display);font-size:15.5px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-h h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--gold)}
.panel-h .sub-t{font-size:12px;color:var(--muted)}
.panel-b{padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.span2{grid-column:span 2}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.info{background:var(--c3-soft);color:var(--c3)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field label .req{color:var(--bad)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
.inp.small{width:auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.form-sec{font-family:var(--display);font-weight:700;font-size:14px;grid-column:1/-1;padding-top:6px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:4px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--fg)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-size:16px}
.bar-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.bar-track{height:12px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px}
.bar-fill.ok{background:var(--ok)} .bar-fill.bad{background:var(--bad)}
.att-btns{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.att-btns button{border:0;background:var(--surface);padding:4px 10px;cursor:pointer;font-weight:600;font-size:12px;border-left:1px solid var(--line)}
.att-btns button:first-child{border-left:0}
.att-btns button.on.P{background:var(--ok-soft);color:var(--ok)}
.att-btns button.on.A{background:var(--bad-soft);color:var(--bad)}
.att-btns button.on.L{background:var(--warn-soft);color:var(--warn)}
.att-btns button.on.H{background:var(--c3-soft);color:var(--c3)}
.mark-inp{width:72px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 6px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-h h3{margin:0;font-family:var(--display);font-size:17px}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:7px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.note{font-size:12.5px;padding:10px 12px;border-radius:6px;background:var(--accent-soft);color:var(--fg);border:1px solid var(--line)}
.receipt{border:1px dashed var(--line);border-radius:8px;padding:16px;font-size:13px}
.receipt .line{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.scrim{display:none}
/* dashboard */
.hello{position:relative;overflow:hidden;border-radius:14px;background:radial-gradient(120% 140% at 100% 0%,#1d4fae 0%,var(--rail) 45%,var(--rail-2) 100%);color:var(--rail-fg);padding:24px 26px;border-bottom:4px solid var(--gold);box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.hello::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;border:2px solid rgba(231,185,77,.25);box-shadow:0 0 0 26px rgba(255,255,255,.03);pointer-events:none}
.hello-id{display:flex;gap:18px;align-items:center;position:relative;z-index:1;min-width:0}
.hello-logo{width:92px;height:92px;flex:none;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 3px var(--gold-2),0 8px 24px rgba(0,0,0,.3)}
.hello .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2)}
.hello .greet{font-size:13px;font-weight:500;color:var(--rail-fg);opacity:.85;margin-top:6px;letter-spacing:.01em}
.hello h2{font-family:var(--display);font-size:28px;margin:0 0 4px;line-height:1.15;text-wrap:balance;color:var(--gold-2);letter-spacing:.01em}
.hello .meta{font-size:13px;color:var(--rail-muted)}
.hello .hello-stats{display:flex;gap:26px;flex-wrap:wrap;position:relative;z-index:1}
.hello .hello-stats>div{border-left:2px solid rgba(231,185,77,.45);padding-left:12px}
.hello .hs-v{font-family:var(--display);font-size:22px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.hello .hs-k{font-size:11.5px;color:var(--rail-muted)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (min-width:1500px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:42px 1fr;gap:4px 12px;align-items:center;text-decoration:none;color:var(--fg)}
.kpi:hover{border-color:var(--gold);transform:translateY(-1px)}
.kpi{transition:transform .15s,border-color .15s}
.kpi .ic{grid-row:span 2;width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.kpi .ic svg{width:21px;height:21px}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .s{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.t-a .ic{background:var(--accent-soft);color:var(--gold)} .t-b .ic{background:var(--c2-soft);color:var(--c2)}
.t-c .ic{background:var(--c3-soft);color:var(--c3)} .t-d .ic{background:var(--c4-soft);color:var(--c4)}
.t-e .ic{background:var(--ok-soft);color:var(--ok)} .t-f .ic{background:var(--bad-soft);color:var(--bad)}
.ring-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.legend b{font-variant-numeric:tabular-nums}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick a{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);font-size:12.5px;font-weight:500}
.quick a:hover{background:var(--sunk)}
.quick svg{width:19px;height:19px;color:var(--gold)}
.quick a:hover{border-color:var(--gold)}
.notice{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.notice:last-child{border-bottom:0}
.notice .nt{font-weight:600}
.notice .nm{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sheet{border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.doc-logo{width:64px;height:64px;border-radius:50%;flex:none}
.logo-prev{width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold);object-fit:contain}
@media (max-width:1060px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3 .span2{grid-column:1/-1}}
@media (max-width:860px){
  .top-logo{display:block}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  .menu-btn{display:grid;place-items:center}
  .grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){.hello-logo{width:64px;height:64px}.hello-id{flex-direction:column;align-items:flex-start;gap:12px}.hello .hello-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}.form-grid,.form-grid.three{grid-template-columns:1fr}.bar-row{grid-template-columns:84px 1fr 56px}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.hello h2{font-size:22px}}
@media (prefers-reduced-motion:reduce){.rail,.nav .chev,.kpi{transition:none}.kpi:hover{transform:none}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
/* login gate */
.gate{position:fixed;inset:0;z-index:70;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gate-brand{background:radial-gradient(120% 120% at 0% 0%,#1d4fae 0%,var(--rail) 45%,var(--rail-2) 100%);color:var(--rail-fg);padding-block:48px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;gap:22px;justify-content:center;border-right:4px solid var(--gold);position:relative;overflow:hidden;min-width:0}
.gate-brand::after{content:"";position:absolute;left:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;border:2px solid rgba(231,185,77,.22);box-shadow:0 0 0 34px rgba(255,255,255,.025);pointer-events:none}
.gate-id{display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.gate-logo{width:150px;height:150px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 4px var(--gold-2),0 14px 40px rgba(0,0,0,.35);flex:none}
.gate-brand h1{font-family:var(--display);font-size:34px;color:var(--gold-2);margin:0;line-height:1.1;text-wrap:balance}
.gate-brand .tag{color:var(--rail-fg);opacity:.85;font-size:14px}
.gate-news{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;max-width:520px}
.gate-news h3{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2)}
.gate-news .gn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px}
.gate-news .gn b{color:#fff;display:block}
.gate-news .gn span{font-size:12.5px;color:var(--rail-muted)}
.gate-form-wrap{display:grid;place-items:center;padding-block:32px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.gate-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.gate-card h2{font-family:var(--display);font-size:24px;margin:0}
.demo{border:1px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.demo>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.demo-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.demo-btns button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 6px;cursor:pointer;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.demo-btns button:hover,.demo-btns button.on{border-color:var(--gold);background:var(--accent-soft)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:58px}
.pw-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 6px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.btn.block{width:100%;justify-content:center;padding:10px 12px;font-size:14px}
.linkish{border:0;background:none;color:var(--c2);cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline}
/* user chip */
.user-chip{position:relative}
.user-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px 3px 3px;cursor:pointer;color:var(--fg)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;box-shadow:0 0 0 2px var(--gold)}
.user-btn .un{font-size:12.5px;font-weight:600;line-height:1.15;text-align:left;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-btn .ur{font-size:11px;color:var(--muted);display:block;text-align:left}
.user-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);min-width:220px;padding:6px;z-index:30;display:flex;flex-direction:column}
.user-menu .um-h{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12px;color:var(--muted)}
.user-menu .um-h b{display:block;color:var(--fg);font-size:13.5px}
.user-menu button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.user-menu button:hover{background:var(--sunk)}
/* roles */
.role-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
.role-list{display:flex;flex-direction:column}
.role-list button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 16px;cursor:pointer}
.role-list button:last-child{border-bottom:0}
.role-list button.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--gold)}
.role-list b{font-size:13.5px}
.role-list span{font-size:12px;color:var(--muted)}
.perm td.c,.perm th.c{text-align:center;width:70px}
.perm input{width:17px;height:17px;accent-color:var(--primary)}
@media (max-width:860px){.gate{grid-template-columns:1fr}.gate-brand{padding:22px 16px;border-right:0;border-bottom:4px solid var(--gold)}.gate-id{flex-direction:row;align-items:center}.gate-logo{width:72px;height:72px}.gate-brand h1{font-size:22px}.gate-news{display:none}.role-layout{grid-template-columns:1fr}}
@media (max-width:860px){
  .topbar{position:static;gap:8px 10px;padding-block:10px;flex-wrap:wrap;box-shadow:none}
  .topbar .grow{min-width:0;flex:1 1 0}
  .crumb{display:none}
  .topbar h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-logo{width:32px;height:32px;flex:none}
  .menu-btn{flex:none}
  .user-chip{order:2;flex:none}
  .top-tools{order:3;flex:1 1 100%;gap:8px}
  .top-tools .branch-sel{flex:1 1 170px;min-width:0}
  .top-tools .branch-sel select{max-width:none;width:100%}
  .top-tools #topActions{gap:6px}
  .top-tools #topActions:empty{display:none}
  .content{padding-block:14px 40px;gap:14px}
  .hello{padding:18px}
  .panel-h{padding:12px}
}
@media (max-width:520px){.user-btn .un,.user-btn .ur{display:none}.user-btn{padding:3px}.demo-btns{grid-template-columns:repeat(2,minmax(0,1fr))}.gate-card{padding:20px}}
</style>

const COLS=["settings","branches","lookups","subjects","classes","students","staff","attendance","staffAtt","exams","payments","feeMaster","txns","payroll","leaves","frontoffice","notices","users","roles"];
const BRANCHED=new Set(["classes","students","staff","attendance","staffAtt","exams","payments","feeMaster","txns","payroll","leaves","frontoffice","notices"]);
const D={};COLS.forEach(c=>D[c]=[]);
let UNSUBS=[],SEEDING=false;
let MODE="loading",DB=null,USER=null,ME=null,CAN_WRITE=true,DL=null;
const loaded=new Set();
let CUR=(()=>{try{return localStorage.getItem("schoolhub-branch")||"main";}catch(e){return "main";}})();

/* ---------- Local fallback ---------- */
const Local={key:"schoolhub-local-v2",
  load(){try{const s=JSON.parse(localStorage.getItem(this.key)||"{}");COLS.forEach(c=>D[c]=s[c]||[]);}catch(e){}},
  save(){try{const s={};COLS.forEach(c=>s[c]=D[c]);localStorage.setItem(this.key,JSON.stringify(s));}catch(e){}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- Store API ---------- */
function stamp(col,data,id){
  const {id:_i,at:_a,by:_b,byUser:_u,...clean}=data;const body={...clean,at:new Date().toISOString(),by:ME||null,byUser:SESSION?SESSION.username:null};
  if(BRANCHED.has(col)&&!body.branchId){const ex=id&&D[col].find(r=>r.id===id);body.branchId=(ex&&ex.branchId)||(CUR==="all"?"main":CUR);}
  return body;}
function need(act){if(SEEDING)return;const m=curMod();if(!perm(m,act)){const e=new Error(`Your role (${roleName()}) is not allowed to ${act} records in ${modName(m)}.`);e.code="perm";throw e;}}
async function rawSet(col,id,data){const body=stamp(col,data,id);
  if(MODE==="shared")await DB.collection(col).doc(id).set(body);
  else{const i=D[col].findIndex(r=>r.id===id);if(i>=0)D[col][i]={id,...body};else D[col].push({id,...body});Local.save();render();}}
const S={
  async add(col,data){need("add");const body=stamp(col,data);
    if(MODE==="shared")await DB.collection(col).add(body);else{D[col].push({id:uid(),...body});Local.save();render();}},
  async set(col,id,data){need(D[col].some(r=>r.id===id)?"edit":"add");return rawSet(col,id,data);},
  async del(col,id){need("delete");if(MODE==="shared")await DB.collection(col).doc(id).delete();else{D[col]=D[col].filter(r=>r.id!==id);Local.save();render();}}
};
async function safe(fn,okMsg){try{await fn();if(okMsg)toast(okMsg);return true;}catch(e){
  if(e&&e.code==="perm"){toast(e.message);}
  else if(e&&e.code==="invalid_argument"){toast("You can view this system but not change it. Ask the instructor for Contributor access.");CAN_WRITE=false;render();}
  else if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete some old records first.");
  else toast("Could not save: "+(e&&e.message||"unknown error"));return false;}}

/* ---------- Boot ---------- */
async function boot(){
  render();
  const c=window.claude;
  const [db,user,dl]=await Promise.all([c?.use?c.use("db"):null,c?.use?c.use("user"):null,c?.use?c.use("downloads"):null]);
  USER=user;DL=dl;
  if(db){DB=db;MODE="shared";
    try{ME=user?await user.id():null;}catch(e){}
    try{OWNER=user?await user.isOwner():false;}catch(e){}
    try{const w=user?await user.can("data.write"):null;if(w===false)CAN_WRITE=false;}catch(e){}
    const timer=setTimeout(()=>{if(loaded.size<COLS.length)$("#modeNote").textContent="Data is slow to arrive; what you see may be out of date.";},10000);
    let pending=false;const soon=()=>{if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;render();});};
    COLS.forEach(col=>UNSUBS.push(DB.collection(col).onSnapshot(snap=>{
      if(MODE!=="shared")return;
      D[col]=snap.docs.map(d=>({id:d.id,...d.data()}));
      if(!snap.metadata.fromCache)loaded.add(col);
      if(loaded.size===COLS.length){clearTimeout(timer);$("#modeNote").textContent="";}
      soon();
    },()=>{loaded.add(col);if(MODE==="shared")$("#modeNote").textContent="Live sync stopped. Reload the page.";})));
  }else{MODE="local";Local.load();}
  render();
}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DEFAULT_GRADES=[{g:"A",min:80},{g:"B",min:70},{g:"C",min:60},{g:"D",min:50},{g:"F",min:0}];
const settings=()=>Object.assign({name:"Al Manaal Modern School",session:"2026–2027",currency:"$",term:"Term 1",grades:DEFAULT_GRADES},(D.settings.find(s=>s.id==="school")||{}));
const logo=()=>settings().logo||DEFAULT_LOGO;
const money=n=>{const x=Number(n||0);return (x<0?"−":"")+settings().currency+Math.abs(x).toLocaleString(undefined,{maximumFractionDigits:2});};
const today=()=>new Date().toISOString().slice(0,10);
const thisMonth=()=>new Date().toISOString().slice(0,7);
const byId=(col,id)=>D[col].find(r=>r.id===id);
const brOf=r=>r.branchId||"main";
const inB=r=>CUR==="all"||brOf(r)===CUR;
const B=col=>D[col].filter(inB);
const L=k=>sortBy(D.lookups.filter(x=>x.kind===k),x=>x.name);
const lname=id=>(byId("lookups",id)||{}).name||"—";
const branches=()=>{const list=sortBy(D.branches,b=>b.code||b.name);if(!list.some(b=>b.id==="main"))list.unshift({id:"main",name:"Main Campus",code:"MAIN",virtual:true});return list;};
const branchName=id=>(branches().find(b=>b.id===id)||{}).name||"Main Campus";
const className=id=>{const c=byId("classes",id);return c?`${c.name}${c.section?" – "+c.section:""}`:"—";};
const stuName=s=>s?`${s.first||""} ${s.last||""}`.trim():"—";
const sortBy=(arr,f)=>[...arr].sort((a,b)=>String(f(a)).localeCompare(String(f(b)),undefined,{numeric:true}));
const grade=p=>{const gs=[...(settings().grades||DEFAULT_GRADES)].sort((a,b)=>b.min-a.min);return (gs.find(x=>p>=Number(x.min))||gs[gs.length-1]).g;};
const gradeChip=p=>{const g=grade(p);const top=(settings().grades||DEFAULT_GRADES).slice().sort((a,b)=>b.min-a.min);const i=top.findIndex(x=>x.g===g);return `<span class="chip ${i<=1?"ok":i===top.length-1?"bad":"warn"}">${esc(g)}</span>`;};
const needBranch=()=>CUR==="all";
const lock=(branched=true,act="edit")=>(!CAN_WRITE||(branched&&needBranch())||!perm(curMod(),act))?"disabled":"";
const active=s=>s.status!=="Disabled"&&s.status!=="Left";
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}
function feePaid(sid){return D.payments.filter(p=>p.studentId===sid).reduce((a,p)=>a+Number(p.amount||0),0);}
function classFee(cid){const m=D.feeMaster.filter(f=>f.classId===cid);if(m.length)return m.reduce((a,f)=>a+Number(f.amount||0),0);const c=byId("classes",cid);return c?Number(c.fee||0):0;}
const feeDue=s=>classFee(s.classId);
function attRate(list){let p=0,t=0;list.forEach(a=>Object.values(a.marks||{}).forEach(v=>{t++;if(v==="P"||v==="L")p++;}));return t?Math.round(p/t*100):null;}
function stuAtt(sid){let p=0,t=0;D.attendance.forEach(a=>{const v=(a.marks||{})[sid];if(v){t++;if(v!=="A")p++;}});return t?Math.round(p/t*100):null;}
function stuAvg(sid){const xs=[];D.exams.forEach(e=>{const m=(e.marks||{})[sid];if(m!==undefined&&m!==""&&e.max)xs.push(Number(m)/Number(e.max)*100);});return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):null;}
const branchNote=()=>needBranch()?`<div class="note">You are viewing <strong>All branches</strong>. Pick one branch in the top bar to add or change records.</div>`:"";
const classOpts=blank=>(blank?[["","— Select class —"]]:[]).concat(sortBy(B("classes"),c=>c.name+c.section).map(c=>[c.id,className(c.id)]));
const opt=(list,val)=>list.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(t)}</option>`;}).join("");

async function exportCSV(filename,rows){
  if(!rows.length){toast("Nothing to export yet.");return;}
  const head=Object.keys(rows[0]);const csv=[head.join(",")].concat(rows.map(r=>head.map(h=>`"${String(r[h]??"").replace(/"/g,'""')}"`).join(","))).join("\n");
  if(!DL){toast("File export is not available in this view.");return;}
  try{await DL.save({filename,data:csv});}catch(e){if(e&&e.code!=="declined")toast("Export was not saved.");}
}

/* ---------- Modal & forms ---------- */
function modal({title,body,onSave,saveLabel="Save",wide=false,danger=false,branched=true}){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true" style="${wide?"width:min(860px,100%)":""}">
  <div class="modal-h"><h3>${esc(title)}</h3><button class="btn ghost sm" id="mx" aria-label="Close">✕</button></div>
  <form id="mform"><div class="modal-b">${body}</div>
  <div class="modal-f"><button type="button" class="btn" id="mc">${onSave?"Cancel":"Close"}</button>${onSave?`<button type="submit" class="btn ${danger?"danger":"primary"}" ${lock(branched)}>${esc(saveLabel)}</button>`:""}</div></form></div></div>`;
  const close=()=>root.innerHTML="";
  $("#mx").onclick=close;$("#mc").onclick=close;
  $("#mbg").addEventListener("click",e=>{if(e.target.id==="mbg")close();});
  $("#mform").addEventListener("submit",async e=>{e.preventDefault();if(!onSave)return close();
    const fd=formData(e.target);const ok=await onSave(fd,e.target);if(ok!==false)close();});
  const first=root.querySelector(".modal-b input,.modal-b select,.modal-b textarea");if(first)first.focus();
}
function formData(form){const fd={};new FormData(form).forEach((v,k)=>{if(fd[k]!==undefined)fd[k]=[].concat(fd[k],v);else fd[k]=v;});return fd;}
function confirmBox(title,text,label,fn,branched=true){modal({title,body:`<p style="margin:0">${text}</p>`,saveLabel:label,danger:true,branched,onSave:async()=>safe(fn,"Done")});}
const confirmDel=(what,fn,branched=true)=>confirmBox("Delete "+what+"?",`This removes the ${esc(what)} for everyone using the system. It cannot be undone.`,"Delete",fn,branched);
function fieldHTML(f,val){
  const v=val??f.def??"";const id="f_"+f.k;const lab=`<label for="${id}">${esc(f.label)}${f.req?' <span class="req">*</span>':""}</label>`;
  const cls=`field ${f.full?"full":""}`;
  if(f.type==="select"){const o=typeof f.opts==="function"?f.opts():f.opts;return `<div class="${cls}">${lab}<select id="${id}" name="${f.k}" ${f.req?"required":""}>${opt(o,v)}</select></div>`;}
  if(f.type==="textarea")return `<div class="${cls}">${lab}<textarea id="${id}" name="${f.k}" rows="3" ${f.req?"required":""}>${esc(v)}</textarea></div>`;
  return `<div class="${cls}">${lab}<input id="${id}" name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${f.req?"required":""} ${f.type==="number"?'min="0" step="0.01"':""} ${f.ph?`placeholder="${esc(f.ph)}"`:""}></div>`;
}

/* ---------- Generic list page (CRUD) ---------- */
function crud(v,cfg){
  const branched=BRANCHED.has(cfg.col);
  let rows=(branched?B(cfg.col):D[cfg.col]).filter(cfg.filter||(()=>true));
  if(cfg.sort)rows=cfg.sort(rows);
  $("#topActions").innerHTML=`${cfg.exportName?`<button class="btn" id="crudExp">Export CSV</button>`:""}<button class="btn primary" id="crudAdd" ${lock(branched,"add")}>+ ${esc(cfg.addLabel||"Add")}</button>`;
  $("#crudAdd").onclick=()=>crudForm(cfg);
  if(cfg.exportName)$("#crudExp").onclick=()=>exportCSV(cfg.exportName,rows.map(r=>Object.fromEntries(cfg.cols.map(c=>[c.label,c.csv?c.csv(r):(c.fmt?String(c.fmt(r)).replace(/<[^>]+>/g,""):r[c.k])]))));
  v.innerHTML=`${branched?branchNote():""}${cfg.intro?`<div class="note">${cfg.intro}</div>`:""}
  <div class="panel"><div class="panel-h"><h2>${esc(cfg.listTitle||ROUTE_META[route()].t)}</h2><span class="sub-t">${rows.length} record${rows.length===1?"":"s"}</span></div>
  ${!rows.length?`<div class="empty"><strong>${esc(cfg.emptyTitle||"Nothing here yet")}</strong>${cfg.empty||"Use the button at the top to add the first record."}</div>`:
  `<div class="tbl-wrap"><table><thead><tr>${cfg.cols.map(c=>`<th class="${c.num?"num":""}">${esc(c.label)}</th>`).join("")}<th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr>${cfg.cols.map(c=>`<td class="${c.num?"num":""} ${c.mono?"mono":""}">${c.fmt?c.fmt(r):esc(r[c.k])}</td>`).join("")}<td style="white-space:nowrap;text-align:right">${cfg.rowActions?cfg.rowActions(r):""}<button class="btn sm" data-cedit="${r.id}" ${lock(branched)}>Edit</button> <button class="btn sm ghost" data-cdel="${r.id}" ${lock(branched,"delete")}>Delete</button></td></tr>`).join("")}</tbody></table></div>`}</div>`;
  v.querySelectorAll("[data-cedit]").forEach(b=>b.onclick=()=>crudForm(cfg,byId(cfg.col,b.dataset.cedit)));
  v.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{const r=byId(cfg.col,b.dataset.cdel);const why=cfg.canDelete&&cfg.canDelete(r);if(why){toast(why);return;}confirmDel(cfg.noun||"record",()=>S.del(cfg.col,r.id),branched);});
  if(cfg.after)cfg.after(v,rows);
}
function crudForm(cfg,row){
  const branched=BRANCHED.has(cfg.col);
  modal({title:(row?"Edit ":"Add ")+(cfg.noun||"record"),branched,body:`<div class="form-grid">${cfg.fields.map(f=>fieldHTML(f,row?row[f.k]:undefined)).join("")}</div>`,
   onSave:async fd=>{const body={...(row||{}),...fd,...(cfg.fixed||{})};cfg.fields.filter(f=>f.type==="number").forEach(f=>body[f.k]=Number(body[f.k]||0));
     if(cfg.validate){const msg=cfg.validate(body,row);if(msg){toast(msg);return false;}}
     return row?safe(()=>S.set(cfg.col,row.id,body),"Saved"):safe(()=>cfg.id?S.set(cfg.col,cfg.id(body),body):S.add(cfg.col,body),"Added");}});
}
function lookupPage(kind,noun,intro,usedBy){
  return v=>crud(v,{col:"lookups",filter:r=>r.kind===kind,fixed:{kind},noun,addLabel:"Add "+noun,intro,sort:r=>sortBy(r,x=>x.name),
    fields:[{k:"name",label:"Name",req:true,full:true},{k:"desc",label:"Description",type:"textarea",full:true}],
    cols:[{k:"name",label:"Name",fmt:r=>`<strong>${esc(r.name)}</strong>`},{k:"desc",label:"Description",fmt:r=>`<span class="muted">${esc(r.desc||"")}</span>`},...(usedBy?[{label:"Used by",num:true,fmt:r=>usedBy(r)}]:[])],
    validate:(b,row)=>D.lookups.some(x=>x.kind===kind&&x.name.trim().toLowerCase()===b.name.trim().toLowerCase()&&(!row||x.id!==row.id))?"That name already exists.":null});
}

function feeRing(due,paid){
  if(!due)return `<div class="muted">Set fees in Fees Master to see collection progress.</div>`;
  const p=paid/due,R=52,C=2*Math.PI*R;
  return `<div class="ring-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${Math.round(p*100)} percent collected"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="16"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--ok)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 70 70)"/><text x="70" y="68" text-anchor="middle" style="font-family:var(--display);font-size:26px;font-weight:700;fill:var(--fg)">${Math.round(p*100)}%</text><text x="70" y="88" text-anchor="middle" style="font-size:11px;fill:var(--muted)">collected</text></svg>
  <div class="legend"><span><i style="background:var(--ok)"></i>Collected <b>${money(paid)}</b></span><span><i style="background:var(--sunk);border:1px solid var(--line)"></i>Remaining <b>${money(due-paid)}</b></span><span class="muted">Expected ${money(due)}</span></div></div>`;
}
function genderDonut(studs){
  const f=studs.filter(s=>s.gender==="Female").length,m=studs.filter(s=>s.gender==="Male").length,t=f+m;
  if(!t)return `<div class="muted">No students yet.</div>`;
  const R=52,C=2*Math.PI*R,fl=C*f/t;
  return `<div class="ring-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${f} female, ${m} male"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--c3)" stroke-width="16"/><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--c4)" stroke-width="16" stroke-dasharray="${fl.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 70 70)"/><text x="70" y="68" text-anchor="middle" style="font-family:var(--display);font-size:26px;font-weight:700;fill:var(--fg)">${t}</text><text x="70" y="88" text-anchor="middle" style="font-size:11px;fill:var(--muted)">students</text></svg>
  <div class="legend"><span><i style="background:var(--c4)"></i>Female <b>${f}</b> <span class="muted">(${Math.round(f/t*100)}%)</span></span><span><i style="background:var(--c3)"></i>Male <b>${m}</b> <span class="muted">(${Math.round(m/t*100)}%)</span></span></div></div>`;
}
function weekAttendance(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10);});
  const vals=days.map(d=>attRate(B("attendance").filter(a=>a.date===d)));
  if(vals.every(x=>x===null))return `<div class="muted">No attendance in the last 7 days.</div>`;
  const W=300,H=150,pl=40,pb=22,pt=8,bw=(W-pl)/7;
  const y=p=>pt+(H-pt-pb)*(1-p/100);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Attendance rate by day">`;
  [0,50,100].forEach(g=>s+=`<line x1="${pl}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-dasharray="${g?"3 3":""}"/><text x="${pl-6}" y="${y(g)+4}" text-anchor="end">${g}%</text>`);
  vals.forEach((p,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6;const lab=new Date(days[i]+"T12:00").toLocaleDateString(undefined,{weekday:"short"});
    if(p!==null)s+=`<rect x="${x}" y="${y(p)}" width="${w}" height="${y(0)-y(p)}" rx="3" fill="${p>=85?"var(--c2)":p>=70?"var(--accent)":"var(--bad)"}"><title>${days[i]}: ${p}%</title></rect>`;
    else s+=`<rect x="${x}" y="${y(0)-2}" width="${w}" height="2" fill="var(--line)"/>`;
    s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${lab}</text>`;});
  return s+"</svg>";
}
function incomeChart(){
  const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7);});
  const inc=months.map(m=>B("payments").filter(p=>String(p.date).slice(0,7)===m).reduce((a,p)=>a+Number(p.amount||0),0)+B("txns").filter(t=>t.type==="income"&&String(t.date).slice(0,7)===m).reduce((a,t)=>a+Number(t.amount||0),0));
  const exp=months.map(m=>B("txns").filter(t=>t.type==="expense"&&String(t.date).slice(0,7)===m).reduce((a,t)=>a+Number(t.amount||0),0)+B("payroll").filter(p=>p.month===m).reduce((a,p)=>a+Number(p.net||0),0));
  const raw=Math.max(...inc,...exp);if(!raw)return `<div class="muted">No income or expenses recorded in the last 6 months.</div>`;
  const step=[10,20,50,100,200,250,500,1000,2000,5000,10000,20000,50000].find(s=>s*4>=raw)||Math.ceil(raw/4);const max=step*4;
  const W=600,H=220,pl=56,pb=26,pt=10,gw=(W-pl)/6;const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and expenses by month">`;
  for(let g=0;g<=4;g++){const val=step*g;s+=`<line x1="${pl}" x2="${W}" y1="${y(val)}" y2="${y(val)}" stroke="var(--line)" stroke-dasharray="${g?"3 3":""}"/><text x="${pl-8}" y="${y(val)+4}" text-anchor="end">${money(val)}</text>`;}
  months.forEach((m,i)=>{const x0=pl+i*gw+gw*.18,w=gw*.3;
    s+=`<rect x="${x0}" y="${y(inc[i])}" width="${w}" height="${y(0)-y(inc[i])}" rx="3" fill="var(--c2)"><title>${m} income ${money(inc[i])}</title></rect>`;
    s+=`<rect x="${x0+w+3}" y="${y(exp[i])}" width="${w}" height="${y(0)-y(exp[i])}" rx="3" fill="var(--c4)"><title>${m} expenses ${money(exp[i])}</title></rect>`;
    s+=`<text x="${pl+i*gw+gw/2}" y="${H-7}" text-anchor="middle">${new Date(m+"-15").toLocaleDateString(undefined,{month:"short"})}</text>`;});
  return s+`</svg><div class="legend" style="flex-direction:row;gap:18px;margin-top:8px"><span><i style="background:var(--c2)"></i>Income</span><span><i style="background:var(--c4)"></i>Expenses</span></div>`;
}
function noticeList(){

function barsByClass(){

async function renderActivity(){
  const items=[];const P=(col,what,det)=>B(col).forEach(r=>items.push({at:r.at,by:r.by,u:r.byUser,what:typeof what==="function"?what(r):what,detail:det(r)}));
  P("students","Student admitted",r=>stuName(r));P("payments","Fee payment",r=>`${stuName(byId("students",r.studentId))} · ${money(r.amount)}`);
  P("attendance","Attendance",r=>`${className(r.classId)} · ${r.date}`);P("exams","Exam marks",r=>`${r.name} · ${r.subject} · ${className(r.classId)}`);
  P("txns",r=>r.type==="income"?"Income":"Expense",r=>`${lname(r.head)!=="—"?lname(r.head):r.head} · ${money(r.amount)}`);P("staff","Staff record",r=>r.name);
  P("notices","Notice",r=>r.title);P("frontoffice",r=>({enquiry:"Admission enquiry",visitor:"Visitor",complaint:"Complaint"}[r.kind]||"Front office"),r=>r.name);
  const top=items.filter(i=>i.at).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,8);
  const el=$("#activity");if(!el)return;
  if(!top.length){el.innerHTML=`<div class="empty">No activity yet. Entries from every module will appear here.</div>`;return;}
  const names={};const ids=[...new Set(top.map(t=>t.by).filter(Boolean))];
  if(USER&&ids.length){try{const ps=await USER.profiles(ids);ids.forEach(id=>names[id]=(ps[id]&&ps[id].name)||"");}catch(e){}}
  const el2=$("#activity");if(!el2)return;
  el2.innerHTML=`<table><thead><tr><th>When</th><th>Module</th><th>Record</th><th>Entered by</th></tr></thead><tbody>${top.map(t=>`<tr><td class="mono muted">${new Date(t.at).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(t.what)}</td><td>${esc(t.detail)}</td><td class="muted">${t.u?`<span class="mono">${esc(t.u)}</span>`:(t.by&&t.by===ME?"You":esc(names[t.by]||"A user"))}</td></tr>`).join("")}</tbody></table>`;
}

/* =================== USERS, ROLES & LOGIN ===================
   Practice login: passwords are stored as salted SHA-256 hashes in the
   shared database. Fine for teaching; not a security boundary, since
   anyone with write access to the database can read or change it.     */
const MODS=[["dashboard","Dashboard"],["fo","Front Office"],["stu","Student Information"],["aca","Academics"],["att","Attendance"],["exam","Examinations"],["fee","Fees Collection"],["inc","Income"],["exp","Expenses"],["hr","Human Resource"],["com","Communicate"],["rep","Reports"],["usr","Users & Roles"],["sys","System Settings"]];
const ACTS=[["view","View"],["add","Add"],["edit","Edit"],["delete","Delete"]];
const FULL=["view","add","edit","delete"];
const PERMS=o=>Object.fromEntries(MODS.map(([k])=>[k,o[k]||[]]));
const DEFAULT_ROLES={
 "role-superadmin":{name:"Super Admin",system:true,desc:"Full access to every module and every branch.",perms:PERMS(Object.fromEntries(MODS.map(([k])=>[k,FULL])))},
 "role-admin":{name:"Admin",desc:"Runs the school day to day. Can see users but not change them.",perms:PERMS({...Object.fromEntries(MODS.map(([k])=>[k,FULL])),dashboard:["view"],usr:["view"]})},
 "role-teacher":{name:"Teacher",desc:"Takes attendance, enters marks and reads student records.",perms:PERMS({dashboard:["view"],stu:["view"],aca:["view"],att:["view","add","edit"],exam:["view","add","edit"],com:["view"],rep:["view"]})},
 "role-accountant":{name:"Accountant",desc:"Collects fees and records income, expenses and payroll.",perms:PERMS({dashboard:["view"],stu:["view"],fee:FULL,inc:FULL,exp:FULL,hr:["view","add"],rep:["view"]})},
 "role-receptionist":{name:"Receptionist",desc:"Handles the front office, enquiries and new admissions.",perms:PERMS({dashboard:["view"],fo:FULL,stu:["view","add","edit"],aca:["view"],com:["view","add"]})}
};
const DEMO_USERS=[["u-superadmin","superadmin",null,"Super Admin","role-superadmin","all",{salt:"a3cf5c78fdf29dc2fbea563a",pwHash:"0d7076af42a6b15cd89a39dbf33e0b7fd32130b49fd21549d524d8c59e8bda16"}],["u-admin","admin","admin123","School Admin","role-admin","main"],["u-teacher","teacher","teacher123","Ahmed Warsame","role-teacher","main"],["u-accountant","accountant","account123","Fadumo Hassan","role-accountant","main"],["u-reception","reception","recep123","Front Desk","role-receptionist","main"],["u-north","north.admin","north123","Sahra Abdi","role-admin","north"]];
let SESSION=null,OWNER=false,gateMode=null,showMenu=false;
const AUTO_LOGIN=location.hash==="#open-admin"?"admin":null; /* a link ending in #open-admin opens already signed in as admin */
let autoTried=false,autoSeeded=false;
const SKEY="schoolhub-session";
const roleOf=u=>u&&byId("roles",u.role);
const roleName=()=>{const r=roleOf(SESSION);return r?r.name:"No role";};
const isSuper=u=>{const r=roleOf(u);return !!(r&&(r.system||r.id==="role-superadmin"));};
function perm(mod,act){if(!SESSION)return false;const r=roleOf(SESSION);if(!r)return false;if(r.system||r.id==="role-superadmin")return true;return ((r.perms||{})[mod]||[]).includes(act);}
const modOf=r=>r==="dashboard"?"dashboard":(ROUTE_META[r]&&ROUTE_META[r].gid)||"dashboard";
const curMod=()=>modOf(route());
const modName=m=>(MODS.find(x=>x[0]===m)||[0,m])[1];
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,"0")).join("");
async function hashPw(salt,pw){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");}
const validUsername=u=>/^[a-z0-9._-]{3,30}$/.test(u);
async function ensureRoles(){for(const [id,r] of Object.entries(DEFAULT_ROLES))if(!byId("roles",id))await rawSet("roles",id,r);}
async function seedDemoUsers(){for(const [id,un,pw,name,role,br,fixed] of DEMO_USERS){if(byId("users",id)||D.users.some(u=>u.username===un))continue;
  if(fixed){await rawSet("users",id,{username:un,name,role,branchId:br,status:"Active",salt:fixed.salt,pwHash:fixed.pwHash});continue;}
  const salt=newSalt();await rawSet("users",id,{username:un,name,role,branchId:br,status:"Active",salt,pwHash:await hashPw(salt,pw),demoPass:pw});}}

function gate(){
  const g=$("#gate");
  const ready=MODE==="local"||(loaded.has("users")&&loaded.has("roles")&&loaded.has("settings"));
  if(SESSION){const fresh=byId("users",SESSION.id);if(!fresh||fresh.status==="Disabled"){logout(fresh?"Your account has been disabled.":"Your account was removed.");return false;}SESSION=fresh;}
  else if(ready){let sid=null;try{sid=sessionStorage.getItem(SKEY);}catch(e){}const u=sid&&byId("users",sid);if(u&&u.status!=="Disabled")SESSION=u;}
  if(SESSION){if(!g.hidden){g.hidden=true;g.innerHTML="";gateMode=null;}return true;}
  if(ready&&AUTO_LOGIN&&!autoTried){autoTried=true;
    const pick=()=>D.users.find(x=>x.username===AUTO_LOGIN&&x.status!=="Disabled");
    if(MODE==="shared"&&!CAN_WRITE){goLocal().then(()=>{const u=pick();if(u)startSession(u);});return false;}
    if(!D.users.length&&MODE==="local"){seedSampleLocal().then(()=>{const u=pick();if(u)startSession(u);});}
    else{const u=pick();if(u){startSession(u);return false;}}}
  if(ready&&MODE==="local"&&!D.users.length&&!autoSeeded){autoSeeded=true;seedSampleLocal();}
  const mode=!ready||(MODE==="local"&&!D.users.length&&autoSeeded&&SEEDING)?"wait":(D.users.length?"login":"setup");
  if(mode!==gateMode){gateMode=mode;g.hidden=false;g.innerHTML=gateHTML(mode);bindGate(mode);}
  return false;
}

  const brand=`<div class="gate-brand"><div class="gate-id"><img class="gate-logo" src="${logo()}" alt="${esc(st.name)} logo"><div><h1>${esc(st.name)}</h1><div class="tag">School management system · Session ${esc(st.session)}</div></div></div>
   ${news.length?`<div class="gate-news"><h3>What’s new</h3>${news.map(n=>`<div class="gn"><b>${esc(n.title)}</b><span>${esc(String(n.message||"").slice(0,110))}</span></div>`).join("")}</div>`:""}</div>`;
  if(mode==="wait")return brand+`<div class="gate-form-wrap"><div class="gate-card"><h2>Opening…</h2><p class="muted" style="margin:0">Loading users and settings.</p></div></div>`;
  if(mode==="setup")return brand+`<div class="gate-form-wrap"><form class="gate-card" id="setupForm"><h2>Create the Super Admin</h2><p class="muted" style="margin:0">No users exist yet. The first account controls everything, including other users and their passwords.</p>
    ${fieldHTML({k:"name",label:"Full name",req:true})}${fieldHTML({k:"username",label:"Username",req:true,ph:"superadmin"})}
    <div class="field"><label for="f_pw">Password <span class="req">*</span></label><div class="pw-wrap"><input id="f_pw" name="pw" type="password" required autocomplete="new-password"><button type="button" class="pw-toggle" data-pwt="f_pw">Show</button></div></div>
    ${fieldHTML({k:"pw2",label:"Confirm password",type:"password",req:true})}
    <div class="err" id="gErr" role="alert"></div><button class="btn primary block" type="submit">Create account and sign in</button>
    ${MODE==="local"?`<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px"><span class="muted" style="font-size:12.5px">Or skip this and practise with a ready-made school: sample classes, students, fees and the practice accounts (admin / admin123, teacher / teacher123 and others).</span><button type="button" class="btn block" id="seedLocal">Load the sample school</button></div>`:""}</form></div>`;
  const demos=st.showDemo==="No"?[]:sortBy(D.users.filter(u=>u.demoPass&&u.status!=="Disabled"),u=>DEMO_USERS.findIndex(d=>d[0]===u.id));
  return brand+`<div class="gate-form-wrap"><form class="gate-card" id="loginForm" autocomplete="on"><h2>Sign in</h2><p class="muted" style="margin:0">Use the username and password your school administrator gave you.</p>
   ${MODE==="shared"&&!CAN_WRITE?`<div class="note" style="display:flex;flex-direction:column;gap:8px">Your access lets you look at the shared school but not change it. Practise on your own copy instead: it starts with the same data and practice accounts, and saves in this browser.<button type="button" class="btn primary goLocal">Practise on my own copy</button></div>`:""}
   ${MODE==="local"?`<div class="note">Practice copy: everything you do is saved in this browser only. <button type="button" class="linkish" id="freshCopy">Start over with a clean copy</button></div>`:""}
   ${demos.length?`<div class="demo"><span>Practice accounts</span><div class="demo-btns">${demos.map(u=>`<button type="button" data-demo="${u.id}" title="${esc(u.username)}">${esc((byId("roles",u.role)||{}).name||u.username)}${u.branchId&&u.branchId!=="all"&&u.branchId!=="main"?" · "+esc(branchName(u.branchId)):""}</button>`).join("")}</div></div>`:""}
   ${fieldHTML({k:"username",label:"Username",req:true})}
   <div class="field"><label for="f_pw">Password <span class="req">*</span></label><div class="pw-wrap"><input id="f_pw" name="pw" type="password" required autocomplete="current-password"><button type="button" class="pw-toggle" data-pwt="f_pw">Show</button></div></div>
   <div class="err" id="gErr" role="alert"></div>
   <button class="btn primary block" type="submit">Sign in</button>
   <div class="muted" style="font-size:12.5px">Forgot your password? Ask the Super Admin to reset it.</div>
   ${OWNER?`<div style="border-top:1px solid var(--line);padding-top:10px"><button type="button" class="linkish" id="ownerIn">I own this system: sign in as Super Admin</button></div>`:""}</form></div>`;
}
function bindGate(mode){
  const g=$("#gate");
  g.querySelectorAll("[data-pwt]").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.pwt);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Show":"Hide";});
  const err=m=>{$("#gErr").textContent=m||"";};
  if(mode==="login"){
    g.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{const u=byId("users",b.dataset.demo);if(!u)return;$("#f_username").value=u.username;$("#f_pw").value=u.demoPass||"";g.querySelectorAll("[data-demo]").forEach(x=>x.classList.toggle("on",x===b));err("");});
    $("#loginForm").onsubmit=async e=>{e.preventDefault();const fd=formData(e.target);const btn=e.target.querySelector("[type=submit]");btn.disabled=true;
      const m=await doLogin(fd.username,fd.pw);btn.disabled=false;if(m)err(m);};
    const oi=$("#ownerIn");if(oi)oi.onclick=()=>{const u=D.users.find(x=>isSuper(x)&&x.status!=="Disabled");if(!u){err("No active Super Admin exists. Ask for help to create one.");return;}startSession(u);toast("Signed in as "+u.name+" (owner recovery)");};
  }
  const fc=$("#freshCopy");if(fc)fc.onclick=()=>{try{localStorage.removeItem(Local.key);}catch(e){}COLS.forEach(c=>D[c]=[]);SESSION=null;gateMode=null;seedSampleLocal();};
  if(mode==="setup"){
    const sl=$("#seedLocal");if(sl)sl.onclick=()=>{sl.disabled=true;sl.textContent="Loading…";seedSampleLocal();};
    $("#setupForm").onsubmit=async e=>{e.preventDefault();const fd=formData(e.target);const un=fd.username.trim().toLowerCase();
      if(!validUsername(un))return err("Usernames use 3–30 lowercase letters, digits, dots, dashes or underscores.");
      if(fd.pw.length<6)return err("Use at least 6 characters for the password.");if(fd.pw!==fd.pw2)return err("The two passwords do not match.");
      try{await ensureRoles();const salt=newSalt();const id="u-"+un.replace(/[^a-z0-9]/g,"");await rawSet("users",id,{username:un,name:fd.name.trim(),role:"role-superadmin",branchId:"all",status:"Active",salt,pwHash:await hashPw(salt,fd.pw)});
        setTimeout(()=>{const u=byId("users",id);if(u)startSession(u);},400);}catch(x){err("Could not create the account: "+(x.message||x.code));}};
  }
}
async function seedSampleLocal(){SEEDING=true;try{await ensureRoles();await seedDemoUsers();await loadSample();}finally{SEEDING=false;}gateMode=null;render();}
async function goLocal(){
  UNSUBS.forEach(u=>{try{u();}catch(e){}});UNSUBS=[];MODE="local";CAN_WRITE=true;
  let had=false;try{had=!!localStorage.getItem(Local.key);}catch(e){}
  if(had)Local.load();else Local.save();
  if(!D.users.length||!D.roles.length){SEEDING=true;try{await ensureRoles();await seedDemoUsers();}finally{SEEDING=false;}}
  SESSION=null;gateMode=null;try{sessionStorage.removeItem(SKEY);}catch(e){}$("#modeNote").textContent="";
  render();toast("You are practising on your own copy now. Sign in with a practice account.");
}
document.addEventListener("click",e=>{if(e.target.closest(".goLocal"))goLocal();});
async function doLogin(username,pw){
  const un=String(username||"").trim().toLowerCase();const u=D.users.find(x=>x.username===un);
  if(!u)return "Wrong username or password.";
  if(u.status==="Disabled")return "This account is disabled. Ask the Super Admin to enable it.";
  if(await hashPw(u.salt,pw)!==u.pwHash)return "Wrong username or password.";
  if(!byId("roles",u.role))return "This account has no role. Ask the Super Admin to assign one.";
  startSession(u);rawSet("users",u.id,{...u,lastLogin:new Date().toISOString()}).catch(e=>{if(e&&e.code==="invalid_argument"&&MODE==="shared"){CAN_WRITE=false;render();}});return null;
}
function startSession(u){SESSION=u;try{sessionStorage.setItem(SKEY,u.id);}catch(e){}if(u.branchId&&u.branchId!=="all")CUR=u.branchId;gateMode=null;openGroups.clear();if(location.hash&&location.hash!=="#dashboard")location.hash="dashboard";else render();toast("Welcome, "+u.name);}
function logout(msg){SESSION=null;showMenu=false;try{sessionStorage.removeItem(SKEY);}catch(e){}gateMode=null;$("#modalRoot").innerHTML="";history.replaceState(null,"","#dashboard");render();if(msg)toast(msg);}
function renderUserChip(){
  const el=$("#userChip");if(!SESSION){el.innerHTML="";return;}
  el.innerHTML=`<button class="user-btn" id="userBtn" aria-haspopup="true" aria-expanded="${showMenu}"><span class="avatar">${esc(initials(SESSION.name))}</span><span><span class="un">${esc(SESSION.name)}</span><span class="ur">${esc(roleName())}</span></span></button>
  ${showMenu?`<div class="user-menu" role="menu"><div class="um-h"><b>${esc(SESSION.name)}</b><span class="mono">${esc(SESSION.username)}</span> · ${esc(roleName())}<br>${esc(SESSION.branchId&&SESSION.branchId!=="all"?branchName(SESSION.branchId):"All branches")}</div><button id="umPw" role="menuitem">Change password</button><button id="umOut" role="menuitem">Log out</button></div>`:""}`;
  $("#userBtn").onclick=e=>{e.stopPropagation();showMenu=!showMenu;renderUserChip();};
  if(showMenu){$("#umOut").onclick=()=>logout("You have logged out.");$("#umPw").onclick=()=>{showMenu=false;renderUserChip();changePwModal();};}
}
document.addEventListener("click",e=>{if(showMenu&&!e.target.closest("#userChip")){showMenu=false;renderUserChip();}});
function pwField(k,label){return `<div class="field"><label for="f_${k}">${label} <span class="req">*</span></label><div class="pw-wrap"><input id="f_${k}" name="${k}" type="password" required autocomplete="new-password"><button type="button" class="pw-toggle" data-pwt="f_${k}">Show</button></div></div>`;}
function bindPwToggles(){document.querySelectorAll("#modalRoot [data-pwt]").forEach(b=>b.onclick=()=>{const i=$("#"+b.dataset.pwt);i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Show":"Hide";});}
function changePwModal(){
  modal({title:"Change your password",branched:false,saveLabel:"Change password",body:`<div class="form-grid">${pwField("cur","Current password")}<div></div>${pwField("pw","New password")}${pwField("pw2","Confirm new password")}</div>`,
   onSave:async fd=>{if(await hashPw(SESSION.salt,fd.cur)!==SESSION.pwHash){toast("The current password is wrong.");return false;}if(fd.pw.length<6){toast("Use at least 6 characters.");return false;}if(fd.pw!==fd.pw2){toast("The new passwords do not match.");return false;}
     const salt=newSalt();const {demoPass,...rest}=SESSION;return safe(async()=>rawSet("users",SESSION.id,{...rest,salt,pwHash:await hashPw(salt,fd.pw)}),"Password changed");}});
  bindPwToggles();
}
/* ----- Users page ----- */
let usrFilter={q:"",role:""};
VIEWS["usr-users"]=v=>{
  $("#topActions").innerHTML=`<button class="btn primary" id="uAdd" ${lock(false,"add")}>+ Add user</button>`;$("#uAdd").onclick=()=>userForm();
  const list=sortBy(D.users.filter(u=>(!usrFilter.role||u.role===usrFilter.role)&&(!usrFilter.q||(u.name+" "+u.username).toLowerCase().includes(usrFilter.q.toLowerCase()))),u=>u.username);
  v.innerHTML=`<div class="note">Each person signs in with their own username and password. Their <strong>role</strong> decides which menus and buttons they get, and their <strong>branch</strong> decides which campus data they see.</div>
  <div class="panel"><div class="panel-h"><div class="row grow"><input class="inp" style="max-width:240px" id="uQ" placeholder="Search name or username" value="${esc(usrFilter.q)}" aria-label="Search users"><select class="inp small" id="uR" aria-label="Role"><option value="">All roles</option>${opt(sortBy(D.roles,r=>r.name).map(r=>[r.id,r.name]),usrFilter.role)}</select></div><span class="sub-t">${list.length} users</span></div>
  ${!list.length?`<div class="empty">No users match.</div>`:`<div class="tbl-wrap"><table><thead><tr><th>User</th><th>Username</th><th>Role</th><th>Branch</th><th>Linked staff</th><th>Last login</th><th>Status</th><th></th></tr></thead><tbody>
  ${list.map(u=>`<tr><td><div class="row" style="gap:10px;flex-wrap:nowrap"><span class="avatar" style="width:30px;height:30px;font-size:11px">${esc(initials(u.name))}</span><strong>${esc(u.name)}</strong>${SESSION&&u.id===SESSION.id?' <span class="chip info">You</span>':""}</div></td><td class="mono">${esc(u.username)}</td><td><span class="chip ${isSuper(u)?"warn":"neutral"}">${esc((byId("roles",u.role)||{}).name||"No role")}</span></td><td>${esc(u.branchId&&u.branchId!=="all"?branchName(u.branchId):"All branches")}</td><td>${esc((byId("staff",u.staffId)||{}).name||"—")}</td><td class="mono muted">${u.lastLogin?new Date(u.lastLogin).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"Never"}</td><td><span class="chip ${u.status==="Disabled"?"neutral":"ok"}">${esc(u.status||"Active")}</span></td>
  <td style="white-space:nowrap;text-align:right"><button class="btn sm" data-ue="${u.id}" ${lock(false)}>Edit</button> <button class="btn sm" data-up="${u.id}" ${lock(false)}>Reset password</button> <button class="btn sm ghost" data-ud="${u.id}" ${lock(false,"delete")}>Delete</button></td></tr>`).join("")}</tbody></table></div>`}</div>`;
  $("#uQ").oninput=e=>{usrFilter.q=e.target.value;const p=e.target.selectionStart;render();const el=$("#uQ");el.focus();el.setSelectionRange(p,p);};
  $("#uR").onchange=e=>{usrFilter.role=e.target.value;render();};
  v.querySelectorAll("[data-ue]").forEach(b=>b.onclick=()=>userForm(byId("users",b.dataset.ue)));
  v.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>resetPwModal(byId("users",b.dataset.up)));
  v.querySelectorAll("[data-ud]").forEach(b=>b.onclick=()=>{const u=byId("users",b.dataset.ud);if(u.id===SESSION.id){toast("You cannot delete your own account.");return;}if(isSuper(u)&&D.users.filter(x=>isSuper(x)&&x.status!=="Disabled").length<=1){toast("Keep at least one active Super Admin.");return;}confirmDel("user "+u.username,()=>S.del("users",u.id),false);});
};
const lastSuper=u=>isSuper(u)&&D.users.filter(x=>isSuper(x)&&x.status!=="Disabled").length<=1;
function userForm(u){
  const isNew=!u;u=u||{status:"Active",branchId:CUR==="all"?"all":CUR};
  const roles=sortBy(D.roles,r=>r.name).filter(r=>isSuper(SESSION)||!(r.system||r.id==="role-superadmin"));
  modal({title:isNew?"Add user":"Edit user "+u.username,branched:false,body:`<div class="form-grid">
   ${fieldHTML({k:"name",label:"Full name",req:true},u.name)}${fieldHTML({k:"username",label:"Username",req:true,ph:"e.g. hodan.ali"},u.username)}
   ${fieldHTML({k:"role",label:"Role",type:"select",req:true,opts:[["","— Select role —"]].concat(roles.map(r=>[r.id,r.name]))},u.role)}${fieldHTML({k:"branchId",label:"Branch",type:"select",opts:[["all","All branches"]].concat(branches().map(b=>[b.id,b.name]))},u.branchId||"all")}
   ${fieldHTML({k:"staffId",label:"Linked staff record",type:"select",opts:[["","— None —"]].concat(sortBy(D.staff,s=>s.name).map(s=>[s.id,`${s.name} (${s.staffId})`]))},u.staffId)}${fieldHTML({k:"phone",label:"Phone",type:"tel"},u.phone)}
   ${fieldHTML({k:"status",label:"Status",type:"select",opts:["Active","Disabled"]},u.status)}<div></div>
   ${isNew?pwField("pw","Password")+pwField("pw2","Confirm password"):`<div class="full muted" style="font-size:12.5px">To change this user’s password, use Reset password in the list.</div>`}</div>`,
   onSave:async fd=>{const un=fd.username.trim().toLowerCase();
     if(!validUsername(un)){toast("Usernames use 3–30 lowercase letters, digits, dots, dashes or underscores.");return false;}
     if(D.users.some(x=>x.username===un&&x.id!==u.id)){toast("That username is already taken.");return false;}
     if(!fd.role){toast("Choose a role.");return false;}
     if(!isNew&&u.id===SESSION.id&&fd.status==="Disabled"){toast("You cannot disable your own account.");return false;}
     if(!isNew&&lastSuper(u)&&(fd.status==="Disabled"||fd.role!==u.role)){toast("Keep at least one active Super Admin.");return false;}
     const body={...u,name:fd.name.trim(),username:un,role:fd.role,branchId:fd.branchId,staffId:fd.staffId,phone:fd.phone,status:fd.status};
     if(isNew){if(fd.pw.length<6){toast("Use at least 6 characters for the password.");return false;}if(fd.pw!==fd.pw2){toast("The two passwords do not match.");return false;}
       body.salt=newSalt();body.pwHash=await hashPw(body.salt,fd.pw);return safe(()=>S.set("users","u-"+un.replace(/[^a-z0-9]/g,"")+"-"+uid().slice(-4),body),"User added");}
     return safe(()=>S.set("users",u.id,body),"User updated");}});
  bindPwToggles();
}
function resetPwModal(u){
  modal({title:"Reset password for "+u.username,branched:false,saveLabel:"Reset password",body:`<p class="muted" style="margin-top:0">Give the new password to ${esc(u.name)} in person. They can change it after signing in.</p><div class="form-grid">${pwField("pw","New password")}${pwField("pw2","Confirm new password")}</div>`,
   onSave:async fd=>{if(fd.pw.length<6){toast("Use at least 6 characters.");return false;}if(fd.pw!==fd.pw2){toast("The passwords do not match.");return false;}
     const salt=newSalt();const {demoPass,...rest}=u;return safe(async()=>S.set("users",u.id,{...rest,salt,pwHash:await hashPw(salt,fd.pw)}),"Password reset");}});
  bindPwToggles();
}
/* ----- Roles page ----- */
let roleSel="";
VIEWS["usr-roles"]=v=>{
  const roles=sortBy(D.roles,r=>(r.system?"0":"1")+r.name);
  if(!roles.some(r=>r.id===roleSel))roleSel=(roles[0]||{}).id||"";
  const r=byId("roles",roleSel);
  $("#topActions").innerHTML=`<button class="btn primary" id="rAdd" ${lock(false,"add")}>+ Add role</button>`;
  $("#rAdd").onclick=()=>modal({title:"Add role",branched:false,body:`<div class="form-grid">${fieldHTML({k:"name",label:"Role name",req:true,ph:"Librarian"})}${fieldHTML({k:"copy",label:"Start from",type:"select",opts:[["","No permissions"]].concat(roles.map(x=>[x.id,"Copy of "+x.name]))})}${fieldHTML({k:"desc",label:"Description",full:true})}</div>`,
    onSave:async fd=>{if(D.roles.some(x=>x.name.toLowerCase()===fd.name.trim().toLowerCase())){toast("A role with that name exists.");return false;}const src=byId("roles",fd.copy);const id="role-"+fd.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+uid().slice(-3);
      const ok=await safe(()=>S.set("roles",id,{name:fd.name.trim(),desc:fd.desc,perms:src?JSON.parse(JSON.stringify(src.perms||{})):PERMS({})}),"Role added");if(ok)roleSel=id;return ok;}});
  if(!roles.length){v.innerHTML=`<div class="panel"><div class="empty"><strong>No roles yet</strong>Load the sample school or add a role.<button class="btn" id="rDef" ${lock(false,"add")}>Create the standard roles</button></div></div>`;const d=$("#rDef");if(d)d.onclick=()=>safe(ensureRoles,"Standard roles created");return;}
  const sys=r&&(r.system||r.id==="role-superadmin");const canEdit=!sys&&perm("usr","edit")&&CAN_WRITE;
  const users=D.users.filter(u=>u.role===roleSel);
  v.innerHTML=`<div class="role-layout"><div class="panel"><div class="panel-h"><h2>Roles</h2></div><div class="role-list">${roles.map(x=>`<button class="${x.id===roleSel?"on":""}" data-role="${x.id}"><b>${esc(x.name)}</b><span>${D.users.filter(u=>u.role===x.id).length} users${x.system||x.id==="role-superadmin"?" · full access":""}</span></button>`).join("")}</div></div>
  <form class="panel" id="permForm"><div class="panel-h"><div><h2>${esc(r.name)}</h2><div class="sub-t" style="margin-top:2px">${esc(r.desc||"")}</div></div><div class="row">${!sys?`<button type="button" class="btn sm ghost" id="rDel" ${lock(false,"delete")}>Delete role</button>`:""}</div></div>
  ${sys?`<div class="panel-b"><div class="note">Super Admin always has every permission in every module, so it cannot be changed or deleted.</div></div>`:""}
  <div class="tbl-wrap"><table class="perm"><thead><tr><th>Module</th>${ACTS.map(([k,t])=>`<th class="c">${t}</th>`).join("")}<th class="c">All</th></tr></thead><tbody>
  ${MODS.map(([m,t])=>{const have=sys?FULL:((r.perms||{})[m]||[]);const acts=m==="dashboard"?["view"]:FULL;return `<tr><td>${esc(t)}</td>${ACTS.map(([a])=>`<td class="c">${acts.includes(a)?`<input type="checkbox" name="p" value="${m}:${a}" ${have.includes(a)?"checked":""} ${canEdit?"":"disabled"} aria-label="${esc(t)} ${a}">`:""}</td>`).join("")}<td class="c">${canEdit?`<button type="button" class="btn sm ghost" data-row="${m}">All</button>`:""}</td></tr>`;}).join("")}</tbody></table></div>
  ${canEdit?`<div class="modal-f"><span class="muted grow" style="font-size:12.5px;margin-right:auto">${users.length} users get these permissions the next time their screen updates.</span><button class="btn primary" type="submit">Save permissions</button></div>`:""}</form></div>`;
  v.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{roleSel=b.dataset.role;render();});
  v.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{const boxes=[...v.querySelectorAll(`input[value^="${b.dataset.row}:"]`)];const on=!boxes.every(x=>x.checked);boxes.forEach(x=>x.checked=on);});
  const del=$("#rDel");if(del)del.onclick=()=>{if(users.length){toast(`Move the ${users.length} users with this role to another role first.`);return;}confirmDel("role "+r.name,()=>S.del("roles",r.id),false);};
  $("#permForm").onsubmit=e=>{e.preventDefault();if(!canEdit)return;const perms=PERMS({});[...v.querySelectorAll('input[name="p"]:checked')].forEach(x=>{const [m,a]=x.value.split(":");perms[m].push(a);});
    MODS.forEach(([m])=>{if(perms[m].some(a=>a!=="view")&&!perms[m].includes("view"))perms[m].unshift("view");});
    safe(()=>S.set("roles",r.id,{...r,perms}),"Permissions saved");};
};

/* ---------- Mobile drawer ---------- */
function closeRail(){$("#rail").classList.remove("open");$("#scrim").classList.remove("open");}
$("#menuBtn").onclick=()=>{$("#rail").classList.add("open");$("#scrim").classList.add("open");};
$("#scrim").onclick=closeRail;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#modalRoot").innerHTML="";closeRail();}});

boot();
</script>
</body></html>
